<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scan details | DrHorticulture</title>
    <link rel="stylesheet" href="/horticulture.css" />
    <script type="module" src="/scan.js"></script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/test.html"
        ><span class="logo" aria-hidden="true">◒</span>DrHorticulture</a
      >
      <nav aria-label="Workspace">
        <a href="/test.html">Analyze photo</a
        ><a href="/ImageData.html" aria-current="page">Scan details</a
        ><a href="/leaf-mask.html">Leaf mask creator</a>
      </nav>
    </header>
    <main class="scan-page">
      <div class="intro">
        <div>
          <h1>Scan details<span>.</span></h1>
          <p>Review the saved photo, the scan decision, and the checks behind it.</p>
        </div>
      </div>
      <section class="panel scan-panel">
        <form id="load-form" class="lookup">
          <label class="field"
            >Scan ID<input name="scan_id" required placeholder="Paste a scan ID"
          /></label>
          <button class="primary" type="submit">Look up scan</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <div id="scan-details" class="scan-layout" hidden>
          <div class="pair">
            <figure id="plant-figure" hidden>
              <div class="photo-stack">
                <img id="stored-image" alt="Stored plant photo" />
                <img id="mask-overlay" class="mask-overlay" alt="" hidden />
              </div>
              <figcaption id="plant-caption">Plant</figcaption>
            </figure>
            <label id="overlay-toggle" class="overlay-toggle" hidden
              ><input id="show-overlay" type="checkbox" checked /> Darken everything outside the
              mask</label
            >
            <figure id="mask-figure" hidden>
              <img
                id="mask-image"
                class="mask-image"
                alt="Leaf mask: white is the area the model analyzed"
              />
              <figcaption id="mask-caption">Mask</figcaption>
            </figure>
            <p id="mask-missing" hidden>
              No leaf mask was stored for this photo. Masks are saved for photos the model analyzed
              and found leaves in.
            </p>
          </div>
          <div>
            <dl id="facts" class="facts"></dl>
            <section id="decision-details" hidden>
              <h2 id="decision-title"></h2>
              <ul id="decision-reasons"></ul>
            </section>
            <h2>Photo quality</h2>
            <dl id="metrics" class="facts"></dl>
            <section id="estimate-details" hidden>
              <h2>Model result</h2>
              <dl id="estimate-facts" class="facts"></dl>
            </section>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
